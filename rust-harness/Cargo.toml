[package]
name = "watersheep-harness"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Typed Rust/WASM harness for WaterSheep System One decisions"
repository = "https://github.com/es-3581100/WaterSheep"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "watersheep-harness"
path = "src/bin/watersheep-harness.rs"
required-features = ["native"]

[features]
default = ["native", "typescript"]
native = ["dep:clap", "dep:reqwest", "dep:tokio"]
typescript = ["dep:ts-rs"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

clap = { version = "4.5", features = ["derive", "env"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
ts-rs = { version = "12.0", features = ["serde-json-impl"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
